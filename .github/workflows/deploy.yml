name: Deploy Learnhub3.0 to EC2
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: abua03/learnhub:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull abua03/learnhub:latest
            docker stop learnhub 2>/dev/null || true
            docker rm -f learnhub 2>/dev/null || true
            docker run -d --name learnhub -p 4000:4000 \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              abua03/learnhub:latest
