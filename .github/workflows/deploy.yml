name: Deploy Learnhub3.0 to EC2
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /var/www/learnhub-app
            git pull origin main
            docker stop learnhub || true
            docker rm learnhub || true
            docker build -t learnhub .
            docker run -d --name learnhub -p 4000:4000 --add-host=host.docker.internal:host-gateway learnhub
